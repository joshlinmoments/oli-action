<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oli-Action · 網頁建置中 Coming Soon</title>
  <meta name="description" content="Oli-Action 南印度海外志工團 · 網頁建置中，敬請期待。Baiyangshan Charitable Foundation × SIST." />
  <meta property="og:title" content="Oli-Action · 歡印光臨 南印度海外志工團" />
  <meta property="og:description" content="網頁建置中，報名即將開放，敬請期待！Website under construction — coming soon." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/banner-web.png" />
  <meta name="theme-color" content="#E89E23" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root{--orange:#E89E23;--orange-d:#CE8410;--orange-edge:#A96A08;--ink:#2A1E10;}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:"Nunito","Noto Sans TC",system-ui,-apple-system,sans-serif;color:#3d2600;
      background:radial-gradient(120% 90% at 50% -10%, #FFD98A 0%, var(--orange) 45%, var(--orange-d) 100%);
      min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:32px 22px;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}

    /* animated sun rays + glow */
    .ray{position:fixed;top:-80px;left:50%;width:min(140vw,760px);aspect-ratio:1;transform:translateX(-50%);
      background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.13) 0deg 8deg,transparent 8deg 22deg);
      border-radius:50%;animation:spin 60s linear infinite;pointer-events:none;opacity:.6;z-index:0}
    .sun{position:fixed;top:-140px;left:50%;transform:translateX(-50%);width:360px;height:360px;border-radius:50%;
      background:radial-gradient(circle,#FFF2CF 0%,rgba(255,242,207,0) 70%);animation:pulse 6s ease-in-out infinite;pointer-events:none;z-index:0}
    @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
    @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

    main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:560px}
    .flogo{height:60px;width:auto;margin-bottom:18px;opacity:.96}
    .mascot{width:min(58%,230px);height:auto;margin:2px 0 6px;
      filter:drop-shadow(0 16px 18px rgba(120,70,0,.32));animation:bob 5s ease-in-out infinite}
    h1{font-weight:900;font-size:clamp(44px,13vw,76px);color:#fff;letter-spacing:-.02em;line-height:1;
      text-shadow:0 3px 0 var(--orange-edge),0 6px 18px rgba(120,70,0,.35)}
    .zh{margin-top:14px;font-family:"Noto Sans TC";font-weight:900;font-size:clamp(16px,4.6vw,21px);color:#4a2c00}
    .zh .tag{background:#3d2600;color:#FFD98A;padding:3px 12px;border-radius:10px;margin-right:6px}

    .status{margin-top:30px;display:inline-flex;align-items:center;gap:11px;background:#fff;color:var(--ink);
      font-weight:900;font-size:clamp(17px,5vw,21px);padding:16px 28px;border-radius:18px;box-shadow:0 6px 0 #E2D4BB}
    .status .dot{width:12px;height:12px;border-radius:50%;background:var(--orange);animation:blink 1.4s infinite}
    .sub{margin-top:18px;font-weight:800;font-size:clamp(14px,4vw,16.5px);color:#4a2c00;line-height:1.7}
    .sub .en{display:block;font-weight:700;color:#5a3a08;opacity:.9;margin-top:3px}

    footer{position:relative;z-index:2;margin-top:auto;padding-top:34px;font-weight:800;font-size:12.5px;color:#5a3a08;letter-spacing:.02em}
    footer b{color:#3d2600}
    @media(prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>
</head>
<body>
  <span class="ray"></span>
  <span class="sun"></span>

  <main>
    <img class="flogo" src="assets/logo-white-web.png" alt="白陽山慈善基金會" />
    <img class="mascot" src="assets/mascot-web.png" alt="Oli-Action mascot" />
    <h1>Oli-Action</h1>
    <div class="zh"><span class="tag">歡印光臨</span> 南印度海外志工團</div>

    <div class="status"><span class="dot"></span> 🚧 網頁建置中</div>
    <p class="sub">報名即將開放，敬請期待！
      <span class="en">Website under construction · Registration opening soon ✨</span>
    </p>
  </main>

  <footer>
    <b>白陽山慈善基金會</b> · Baiyangshan Charitable Foundation　|　Taiwan → South India · 2026
  </footer>
</body>
</html>
